# Hooks locais (prek), também executados pelo workflow público .github/workflows/validate.yml.
# Instalar o hook: prek install
default_install_hook_types: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: okf-check
        name: okf-parser check (Markdown do acervo)
        entry: uvx okf-parser==0.48.2 check . --normative-spec --require-spec .okf/specs/{slug}.md
        language: system
        pass_filenames: false
        always_run: true
      - id: dr70-corpus-identity
        name: DR-70 corpus JSON/ID identity
        entry: python3 -B scripts/check_fidelity_corpus.py
        language: system
        pass_filenames: false
        always_run: true
      - id: dr70-corpus-identity-tests
        name: DR-70 corpus negative controls
        entry: python3 -B -m unittest discover -s tests -p test_check_fidelity_corpus.py -q
        language: system
        pass_filenames: false
        always_run: true
      - id: dr70-corpus-schema
        name: DR-70 corpus JSON Schema 2020-12 and format checks
        entry: uvx --with 'jsonschema[format]==4.26.0' python3 -B -m scripts.check_fidelity_schema
        language: system
        pass_filenames: false
        always_run: true
      - id: dr70-corpus-schema-tests
        name: DR-70 corpus schema negative controls
        entry: uvx --with 'jsonschema[format]==4.26.0' python3 -B -m unittest discover -s tests -p test_check_fidelity_schema.py -q
        language: system
        pass_filenames: false
        always_run: true
      - id: rom-quarantine-tests
        name: DR-70 quarantine fail-closed synthetic tests
        entry: python3 -B -m unittest discover -s tests -p test_rom_quarantine.py -q
        language: system
        pass_filenames: false
        always_run: true
      - id: sem-binarios-historicos
        name: bloqueia ROM/firmware de procedência não esclarecida
        entry: "Arquivos binários de firmware não podem ser versionados sem análise de procedência (docs/research-plan.md)."
        language: fail
        files: '\.(bin|rom|hex|eprom)$'
