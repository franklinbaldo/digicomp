name: Experimental Rust candidate models
on:
  pull_request:
    paths:
      - 'experiments/rust-output-v0/**'
      - '.github/workflows/experimental-rust.yml'
  push:
    branches: [main]
    paths:
      - 'experiments/rust-output-v0/**'
      - '.github/workflows/experimental-rust.yml'
permissions:
  contents: read
jobs:
  rust-candidates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (synthetic; not historical fidelity)
        run: cargo test --manifest-path experiments/rust-output-v0/Cargo.toml
      - name: Two models, identical input
        run: |
          cargo run --manifest-path experiments/rust-output-v0/Cargo.toml -- --ascendant 15.25 --model equal
          cargo run --manifest-path experiments/rust-output-v0/Cargo.toml -- --ascendant 15.25 --model whole-sign
