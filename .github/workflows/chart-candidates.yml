name: Historical chart input candidates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact chart checkout SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate published input candidates and negative controls
        run: python -B -m unittest discover -s tests -p 'test_chart_input_candidates.py' -v
      - name: Produce a strictly labelled normalized candidate
        run: python scripts/chart_input_candidates.py --id RAEL1980-CARTER
      - name: FDR indexed editorial angles negative controls without ephemeris
        run: python -B -m unittest discover -s tests -p 'test_fdr_published_aspects.py' -v
      - name: Install optional research-only Swiss Ephemeris binding
        run: python -m pip install 'pyswisseph==2.10.3.2'
      - name: Compare indexed editorial FDR angles to modern Moshier scenarios
        run: |
          python -B -m unittest discover -s tests -p 'test_fdr_published_aspects.py' -v
          python -O -B -m unittest discover -s tests -p 'test_fdr_published_aspects.py' -v
          python -B scripts/probe_fdr_published_aspects.py
